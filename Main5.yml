name: Build Lovable App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Show build output
        run: |
          echo "=== Archivos del proyecto ==="
          ls -la
          echo "=== Carpetas generadas ==="
          find . -maxdepth 4 -type d \
            -not -path "./node_modules*" \
            -not -path "./.git*" | sort

      - name: Find generated files
        run: |
          echo "=== Archivos HTML ==="
          find . -name "*.html" -not -path "./node_modules/*"
          echo "=== Archivos JS ==="
          find . -name "*.js" -not -path "./node_modules/*" | head -100

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: casatapiz-build
          path: |
            .output/
            .vercel/
            dist/
            build/
          if-no-files-found: warn
