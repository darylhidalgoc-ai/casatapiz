name: Build sitio estático para cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

      - name: Generate static site
        run: |
          mkdir -p static
          wget -q -r -l 5 -p -k -E -nH -P static http://localhost:3000/ || true
          # Rutas conocidas (por si algún enlace no fue descubierto)
          for p in tapiceria-santiago tapicero-santiago restauracion-de-muebles-santiago; do
            wget -q -p -k -E -nH -P static "http://localhost:3000/$p" || true
          done
          cp -f public/robots.txt static/ 2>/dev/null || true
          cp -f public/sitemap.xml static/ 2>/dev/null || true
          ls -la static

      - name: Add .htaccess (URLs limpias + caché)
        run: |
          cat > static/.htaccess <<'EOF'
          Options -MultiViews
          RewriteEngine On

          # /tapiceria-santiago -> tapiceria-santiago.html
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.+)$ $1.html [L]

          ErrorDocument 404 /index.html

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/jpeg "access plus 6 months"
            ExpiresByType image/png "access plus 6 months"
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>
          EOF

      - name: Package for cPanel
        run: cd static && zip -r ../casatapiz-cpanel.zip . -x '.git/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: casatapiz-cpanel
          path: casatapiz-cpanel.zip
          if-no-files-found: error

      # Opcional: subida automática por FTP.
      # Configura en GitHub > Settings > Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      - name: Deploy por FTP a cPanel (opcional)
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./static/
          server-dir: ./public_html/
