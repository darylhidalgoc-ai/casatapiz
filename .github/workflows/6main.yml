name: Build Lovable App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package application
        run: |
          cd .output
          zip -r ../casatapiz-output.zip .

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: casatapiz-output
          path: casatapiz-output.zip
          if-no-files-found: error
